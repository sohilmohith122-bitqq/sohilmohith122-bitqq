name: Lint & Validate Universe

on:
  push:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'scripts/**'
      - 'README.template.md'
      - 'profile.config.json'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js 20
        # actions/setup-node@v4.1.0
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a1
        with:
          node-version: 20

      - name: Execute Validation Suite
        run: npm run test
