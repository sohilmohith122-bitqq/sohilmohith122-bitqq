name: Lint Profile SVGs & Links

on:
  push:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'scripts/**'
      - 'README.template.md'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Profile Linter
        run: npm run lint
