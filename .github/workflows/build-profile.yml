name: Build & Refresh Profile

on:
  schedule:
    # Run once daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/*.svg'
      - 'README.md'
      - 'profile.config.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Build Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Run Profile Lint Suite
        run: npm run lint

      - name: Generate Contribution Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?color_snake=#00ff9c&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            assets/snake-dark.svg?palette=github-dark&color_snake=#00ff9c

      - name: Commit & Push Profile Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ README.md profile.config.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(profile): refresh generated assets [skip ci]"
            git push
          else
            console_msg="No automated profile diff detected; skipping commit."
            echo "$console_msg"
          fi
