<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="320">
  <title>SOHIL.exe - The 2D Developer Universe</title>
  <desc>Original flat 2D vector workstation illustration featuring desktop terminal, floating code panes, pixel plant, and celestial window.</desc>

  <style>
    
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .bold { font-weight: 700; }
    
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .cursor-blink {
      animation: blink 0.9s infinite step-start;
    }
    .node-pulse {
      animation: pulseNode 3s infinite ease-in-out;
      transform-origin: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor-blink, .node-pulse, * {
        animation: none !important;
        transition: none !important;
      }
    }
  
    .banner-title { font-size: 13px; font-weight: 700; fill: #e6edf3; letter-spacing: 1px; }
    .term-text { font-size: 11px; fill: #e6edf3; }
    .muted-text { font-size: 10px; fill: #8b949e; }
  </style>

  <!-- Outer Canvas Frame -->
  <rect x="1" y="1" width="958" height="318" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="2" />
  <rect x="3" y="3" width="954" height="314" rx="6" fill="none" stroke="#b7ff3c" stroke-opacity="0.1" stroke-width="1" />

  <!-- Top System Bar -->
  <rect x="2" y="2" width="956" height="34" rx="6" fill="#161b22" />
  <line x1="2" y1="36" x2="958" y2="36" stroke="#30363d" stroke-width="1.5" />

  <!-- Pixel Cursor Signature & Universe Identifier -->
  <g transform="translate(20, 10) scale(1)">
    <!-- Outer Corner Brackets (2px flat pixel strokes) -->
    <rect x="0" y="0" width="4" height="2" fill="#b7ff3c" />
    <rect x="0" y="2" width="2" height="2" fill="#b7ff3c" />

    <rect x="12" y="0" width="4" height="2" fill="#b7ff3c" />
    <rect x="14" y="2" width="2" height="2" fill="#b7ff3c" />

    <rect x="0" y="14" width="4" height="2" fill="#b7ff3c" />
    <rect x="0" y="12" width="2" height="2" fill="#b7ff3c" />

    <rect x="12" y="14" width="4" height="2" fill="#b7ff3c" />
    <rect x="14" y="12" width="2" height="2" fill="#b7ff3c" />

    <!-- Center Geometric Core Node -->
    <rect x="6" y="6" width="4" height="4" fill="#58a6ff" />
  </g>
  <text x="44" y="22" class="mono banner-title">SOHIL.exe <tspan fill="#8b949e">// THE 2D DEVELOPER UNIVERSE</tspan></text>
  
  <circle cx="910" cy="18" r="4" fill="#b7ff3c" class="node-pulse" />
  <text x="898" y="22" text-anchor="end" class="mono bold" font-size="10" fill="#8b949e">SYS: ONLINE</text>

  <!-- BACKGROUND: Geometric Sky Window with Crescent Moon -->
  <g transform="translate(760, 56)">
    <!-- Window Frame -->
    <rect width="160" height="90" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2" />
    <line x1="0" y1="45" x2="160" y2="45" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="80" y1="0" x2="80" y2="90" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Crescent Moon (Pure 2D Flat Geometric Circles) -->
    <circle cx="120" cy="35" r="18" fill="#ff8a3d" />
    <circle cx="127" cy="30" r="15" fill="#161b22" />

    <!-- 4 Twinkling Pixel Stars -->
    <rect x="35" y="22" width="4" height="4" fill="#b7ff3c" />
    <rect x="60" y="32" width="3" height="3" fill="#e6edf3" />
    <rect x="42" y="65" width="3" height="3" fill="#58a6ff" />
    <rect x="135" y="68" width="4" height="4" fill="#b7ff3c" />
  </g>

  <!-- NETWORK: Connected Micro-Nodes Linking Workstation to Floating Panes -->
  <g stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="430" y1="130" x2="520" y2="85" />
    <line x1="520" y1="85" x2="760" y2="100" />
    <line x1="430" y1="180" x2="540" y2="210" />
    <line x1="680" y1="210" x2="740" y2="210" />
  </g>
  <!-- Micro Node Dots -->
  <circle cx="520" cy="85" r="3.5" fill="#b7ff3c" />
  <circle cx="540" cy="210" r="3.5" fill="#58a6ff" />

  <!-- WORKSTATION: Main Flat 2D Computer & Terminal -->
  <g transform="translate(45, 68)">
    <!-- Monitor Bezel Outer Frame -->
    <rect width="380" height="200" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2" />
    
    <!-- Monitor Stand Base -->
    <rect x="165" y="200" width="50" height="24" fill="#30363d" />
    <rect x="135" y="224" width="110" height="6" rx="3" fill="#30363d" />

    <!-- Monitor Inner Screen Display -->
    <rect x="12" y="12" width="356" height="176" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

    <!-- Terminal Window Chrome inside Monitor -->
    <rect x="12" y="12" width="356" height="22" rx="4" fill="#161b22" />
    <circle cx="26" cy="23" r="3" fill="#f778ba" />
    <circle cx="36" cy="23" r="3" fill="#ff8a3d" />
    <circle cx="46" cy="23" r="3" fill="#b7ff3c" />
    <text x="60" y="26" class="mono" font-size="9" fill="#8b949e">sohil@universe: ~/core</text>

    <!-- Terminal Content & Logs -->
    <g transform="translate(26, 54)">
      <text x="0" y="0" class="mono term-text"><tspan fill="#b7ff3c">$</tspan> sohil.boot --autonomous</text>
      <text x="0" y="20" class="mono term-text"><tspan fill="#b7ff3c">[OK]</tspan> loaded 2d_vector_art_subsystem</text>
      <text x="0" y="38" class="mono term-text"><tspan fill="#b7ff3c">[OK]</tspan> 4 verified projects online</text>
      <text x="0" y="56" class="mono term-text"><tspan fill="#ff8a3d">[INFO]</tspan> tea.daemon: brewed hot</text>
      <text x="0" y="78" class="mono term-text"><tspan fill="#58a6ff">❯</tspan> architecting systems<tspan class="cursor-blink" fill="#b7ff3c"> ▋</tspan></text>
    </g>

    <!-- Keyboard Flat Base & Trackpad -->
    <g transform="translate(25, 235)">
      <rect width="330" height="10" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <rect x="140" y="3" width="50" height="4" rx="1" fill="#30363d" />
    </g>
  </g>

  <!-- POTTED PIXEL PLANT (Flat 2D Terracotta & Leaves) -->
  <g transform="translate(435, 225)">
    <!-- Pot Body -->
    <polygon points="12,18 36,18 32,46 16,46" fill="#ff8a3d" stroke="#30363d" stroke-width="2" />
    <rect x="8" y="14" width="32" height="5" rx="1.5" fill="#ff8a3d" stroke="#30363d" stroke-width="2" />
    <!-- Pixel Foliage (Electric Lime Rects) -->
    <rect x="22" y="4" width="4" height="10" fill="#b7ff3c" />
    <rect x="14" y="0" width="8" height="6" rx="2" fill="#b7ff3c" />
    <rect x="26" y="2" width="10" height="6" rx="2" fill="#b7ff3c" />
    <rect x="18" y="-4" width="6" height="8" rx="2" fill="#b7ff3c" />
  </g>

  <!-- COFFEE MUG (Flat 2D with Steam) -->
  <g transform="translate(485, 238)">
    <rect width="18" height="24" rx="3" fill="#161b22" stroke="#30363d" stroke-width="2" />
    <path d="M 18,6 C 24,6 24,18 18,18" fill="none" stroke="#30363d" stroke-width="2" />
    <rect x="4" y="4" width="10" height="2" fill="#ff8a3d" />
    <!-- Pixel Steam -->
    <rect x="6" y="-8" width="2" height="5" fill="#8b949e" opacity="0.6" />
    <rect x="11" y="-12" width="2" height="6" fill="#8b949e" opacity="0.6" />
  </g>

  <!-- FLOATING PANE 1: Browser Window (Derma-Vortex Preview) -->
  <g transform="translate(520, 68)">
    <rect width="210" height="120" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2" />
    <rect width="210" height="22" rx="6" fill="#0d1117" />
    <circle cx="12" cy="11" r="2.5" fill="#f778ba" />
    <circle cx="20" cy="11" r="2.5" fill="#ff8a3d" />
    <circle cx="28" cy="11" r="2.5" fill="#b7ff3c" />
    <text x="38" y="14" class="mono muted-text">derma_vortex.ai</text>

    <!-- Mini Neural Layout inside Pane -->
    <g transform="translate(20, 38)">
      <rect width="170" height="68" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <circle cx="35" cy="34" r="6" fill="#b7ff3c" />
      <circle cx="85" cy="22" r="5" fill="#58a6ff" />
      <circle cx="85" cy="46" r="5" fill="#bc8cff" />
      <circle cx="135" cy="34" r="6" fill="#b7ff3c" />
      <line x1="35" y1="34" x2="85" y2="22" stroke="#30363d" stroke-width="1.5" />
      <line x1="35" y1="34" x2="85" y2="46" stroke="#30363d" stroke-width="1.5" />
      <line x1="85" y1="22" x2="135" y2="34" stroke="#30363d" stroke-width="1.5" />
      <line x1="85" y1="46" x2="135" y2="34" stroke="#30363d" stroke-width="1.5" />
    </g>
  </g>

  <!-- FLOATING PANE 2: Editor Syntax Pane -->
  <g transform="translate(560, 205)">
    <rect width="200" height="78" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2" />
    <rect width="200" height="18" rx="6" fill="#0d1117" />
    <text x="12" y="13" class="mono muted-text">pipeline.ts</text>
    <rect x="12" y="28" width="45" height="4" rx="2" fill="#58a6ff" />
    <rect x="62" y="28" width="65" height="4" rx="2" fill="#bc8cff" />
    <rect x="22" y="38" width="85" height="4" rx="2" fill="#b7ff3c" />
    <rect x="22" y="48" width="55" height="4" rx="2" fill="#e6edf3" />
    <rect x="82" y="48" width="35" height="4" rx="2" fill="#ff8a3d" />
    <rect x="12" y="58" width="25" height="4" rx="2" fill="#58a6ff" />
  </g>

  <!-- EASTER EGG (Deliberate & Harmless) -->
  <text x="935" y="300" text-anchor="end" class="mono" font-size="9" fill="#30363d">// hello, world</text>
</svg>