<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="160">
  <title>Contribution Snake Grid Animation (Light)</title>
  <desc>Matrix green animated contribution snake eating git activity commits.</desc>
  <defs>
    <linearGradient id="gridBgLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6f8fa" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <rect width="800" height="160" rx="6" fill="url(#gridBgLight)" stroke="#d0d7de" stroke-width="1.2" />

  <!-- Grid Header -->
  <text x="35" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="bold" fill="#0969da">&gt; ./snake --stream --palette=light</text>
  <line x1="35" y1="32" x2="765" y2="32" stroke="#d0d7de" stroke-width="1" />

  <!-- Contribution Dots (53 columns x 7 days) -->
