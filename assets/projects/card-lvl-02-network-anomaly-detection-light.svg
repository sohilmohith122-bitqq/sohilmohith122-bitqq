<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="440" height="240">
  <title>Network-Anomaly-Detection - LVL 02</title>
  <desc>Real-time telemetry analysis and network anomaly detection pipeline</desc>

  <style>
    
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .bold { font-weight: 700; }
    
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .cursor-blink {
      animation: blink 0.9s infinite step-start;
    }
    .node-pulse {
      animation: pulseNode 3s infinite ease-in-out;
      transform-origin: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor-blink, .node-pulse, * {
        animation: none !important;
        transition: none !important;
      }
    }
  
    .card-title { font-size: 14px; font-weight: 700; fill: #1f2328; letter-spacing: 0.5px; }
    .card-desc { font-size: 11px; fill: #656d76; }
    .card-link { font-size: 11px; font-weight: 700; fill: #a84300; }
  </style>

  <a href="https://github.com/sohilmohith122-bitqq/Network-Anomaly-Detection" target="_blank" rel="noopener noreferrer">
    <!-- Card Outer Frame -->
    <rect x="1" y="1" width="438" height="238" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2" />
    <rect x="3" y="3" width="434" height="234" rx="6" fill="none" stroke="#a84300" stroke-opacity="0.12" stroke-width="1" />

    <!-- Top Navigation Bar -->
    <rect x="2" y="2" width="436" height="36" rx="6" fill="#ffffff" />
    <line x1="2" y1="38" x2="438" y2="38" stroke="#d0d7de" stroke-width="1.5" />

    <!-- Pixel Cursor & Level Identifier -->
    <g transform="translate(16, 11) scale(1)">
    <!-- Outer Corner Brackets (2px flat pixel strokes) -->
    <rect x="0" y="0" width="4" height="2" fill="#a84300" />
    <rect x="0" y="2" width="2" height="2" fill="#a84300" />

    <rect x="12" y="0" width="4" height="2" fill="#a84300" />
    <rect x="14" y="2" width="2" height="2" fill="#a84300" />

    <rect x="0" y="14" width="4" height="2" fill="#a84300" />
    <rect x="0" y="12" width="2" height="2" fill="#a84300" />

    <rect x="12" y="14" width="4" height="2" fill="#a84300" />
    <rect x="14" y="12" width="2" height="2" fill="#a84300" />

    <!-- Center Geometric Core Node -->
    <rect x="6" y="6" width="4" height="4" fill="#0969da" />
  </g>
    <text x="40" y="22" class="mono bold" font-size="11" fill="#a84300">LVL 02</text>
    <text x="105" y="22" class="mono" font-size="11" fill="#656d76">// COLLECTIBLE REPO</text>

    <!-- Status Indicator -->
    <circle cx="410" cy="20" r="3.5" fill="#a84300" />
    <text x="400" y="23" text-anchor="end" class="mono bold" font-size="10" fill="#656d76">ACTIVE</text>

    <!-- 2D Vector Motif Scene -->
    
        <g transform="translate(18, 52)">
          <rect width="404" height="64" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
          <!-- Mini Server Unit -->
          <rect x="25" y="14" width="70" height="36" rx="3" fill="#f6f8fa" stroke="#a84300" stroke-width="1.5" />
          <line x1="32" y1="24" x2="70" y2="24" stroke="#656d76" stroke-width="1.5" />
          <line x1="32" y1="32" x2="60" y2="32" stroke="#656d76" stroke-width="1.5" />
          <circle cx="85" cy="24" r="2.5" fill="#a84300" />
          <circle cx="85" cy="32" r="2.5" fill="#0969da" />

          <!-- Pulse Stream Bar Graph -->
          <g transform="translate(125, 14)">
            <rect x="0" y="24" width="8" height="12" fill="#a84300" />
            <rect x="16" y="16" width="8" height="20" fill="#a84300" />
            <rect x="32" y="8" width="8" height="28" fill="#a84300" />
            <rect x="48" y="20" width="8" height="16" fill="#a84300" />
            <rect x="64" y="4" width="8" height="32" fill="#bf3989" />
            <rect x="80" y="14" width="8" height="22" fill="#a84300" />
            <rect x="96" y="26" width="8" height="10" fill="#656d76" />
          </g>

          <!-- Waveform Line -->
          <path d="M 250,32 L 280,32 L 290,14 L 305,48 L 320,18 L 335,32 L 380,32" fill="none" stroke="#a84300" stroke-width="2" />
        </g>
      

    <!-- Content Area: Name & Factual Description -->
    <text x="18" y="142" class="mono card-title">Network-Anomaly-Detection</text>
    <text x="18" y="162" class="mono card-desc">Real-time telemetry analysis and network anomaly detect...</text>
    <text x="18" y="178" class="mono card-desc">ion pipeline</text>

    <!-- Technology Tags -->
    
      <g transform="translate(18, 206)">
        <rect width="58" height="20" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
        <text x="29" y="14" text-anchor="middle" class="mono" font-size="10" fill="#1f2328">Python</text>
      </g>

      <g transform="translate(82, 206)">
        <rect width="66" height="20" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
        <text x="33" y="14" text-anchor="middle" class="mono" font-size="10" fill="#1f2328">FastAPI</text>
      </g>

      <g transform="translate(154, 206)">
        <rect width="81" height="20" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
        <text x="41" y="14" text-anchor="middle" class="mono" font-size="10" fill="#1f2328">Telemetry</text>
      </g>

    <!-- Access CTA Button -->
    <g transform="translate(348, 206)">
      <rect width="74" height="20" rx="4" fill="#ffffff" stroke="#a84300" stroke-width="1.2" />
      <text x="37" y="14" text-anchor="middle" class="mono card-link">VIEW ↗</text>
    </g>
  </a>
</svg>