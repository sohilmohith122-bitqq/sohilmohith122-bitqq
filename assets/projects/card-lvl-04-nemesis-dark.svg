<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <title>NEMESIS - LVL 04</title>
  <desc>Autonomous dual-loop voice assistant and security testing environment</desc>

  <style>
    
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .bold { font-weight: 700; }
    
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .cursor-blink {
      animation: blink 1s infinite step-start;
    }
    .node-pulse {
      animation: pulseNode 3s infinite ease-in-out;
      transform-origin: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor-blink, .node-pulse, * {
        animation: none !important;
        transition: none !important;
      }
    }
  
    .card-title { font-size: 15px; font-weight: 700; fill: #e6edf3; letter-spacing: 0.5px; }
    .card-desc { font-size: 11px; fill: #8b949e; }
    .card-link { font-size: 11px; font-weight: 700; fill: #ff8a3d; }
    .category-label { font-size: 9px; font-weight: 700; fill: #8b949e; letter-spacing: 1px; }
  </style>

  <a href="https://github.com/sohilmohith122-bitqq/NEMESIS" target="_blank" rel="noopener noreferrer">
    <!-- Card Outer Frame -->
    <rect x="1" y="1" width="478" height="268" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2" />
    <rect x="3" y="3" width="474" height="264" rx="6" fill="none" stroke="#ff8a3d" stroke-opacity="0.12" stroke-width="1" />

    <!-- Top Technical Banner -->
    <rect x="2" y="2" width="476" height="38" rx="6" fill="#0d1117" />
    <line x1="2" y1="40" x2="478" y2="40" stroke="#30363d" stroke-width="1.5" />

    <!-- Brand Symbol Sequence Badge -->
    <g transform="translate(14, 11) scale(0.1875)">
    <!-- 8px Grid Outer Corner Brackets (Cells 1,1; 10,1; 1,10; 10,10) -->
    <!-- Top-Left -->
    <rect x="8" y="8" width="16" height="8" fill="#30363d" />
    <rect x="8" y="16" width="8" height="16" fill="#30363d" />

    <!-- Top-Right -->
    <rect x="72" y="8" width="16" height="8" fill="#30363d" />
    <rect x="80" y="16" width="8" height="16" fill="#30363d" />

    <!-- Bottom-Left -->
    <rect x="8" y="80" width="16" height="8" fill="#30363d" />
    <rect x="8" y="64" width="8" height="16" fill="#30363d" />

    <!-- Bottom-Right -->
    <rect x="72" y="80" width="16" height="8" fill="#30363d" />
    <rect x="80" y="64" width="8" height="16" fill="#30363d" />

    <!-- Terminal Chevron '>' Silhouette (Cells 3,3 to 6,5 to 3,8) -->
    <rect x="24" y="24" width="8" height="8" fill="#58a6ff" />
    <rect x="32" y="32" width="8" height="8" fill="#58a6ff" />
    <rect x="40" y="40" width="8" height="8" fill="#58a6ff" />
    <rect x="48" y="40" width="8" height="8" fill="#58a6ff" />
    <rect x="40" y="48" width="8" height="8" fill="#58a6ff" />
    <rect x="32" y="56" width="8" height="8" fill="#58a6ff" />
    <rect x="24" y="64" width="8" height="8" fill="#58a6ff" />

    <!-- The Signature Lime-Green Signal Block (16x16: Cells 7,6 & 8,6) -->
    <rect x="56" y="48" width="16" height="16" rx="2" fill="#b7ff3c" class="node-pulse" />

    

    <!-- Auxiliary Data Node (Cell 8,9) -->
    <rect x="64" y="72" width="8" height="8" rx="1" fill="#8b949e" />
  </g>
    <text x="38" y="24" class="mono bold" font-size="11" fill="#ff8a3d">LVL 04</text>
    <text x="100" y="24" class="mono category-label">// AUTONOMOUS / AUDIO_SECURITY</text>

    <!-- Active Indicator -->
    <circle cx="452" cy="21" r="3.5" fill="#ff8a3d" />
    <text x="442" y="24" text-anchor="end" class="mono bold" font-size="9" fill="#8b949e">ONLINE</text>

    <!-- 2D Vector Motif Scene -->
    
        <g transform="translate(18, 52)">
          <rect width="444" height="74" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
          <!-- Mini Terminal Pane -->
          <rect x="25" y="15" width="180" height="44" rx="3" fill="#161b22" stroke="#ff8a3d" stroke-width="1.5" />
          <text x="35" y="32" class="mono bold" font-size="9" fill="#ff8a3d">&gt; vad.stream --cuda</text>
          <text x="35" y="46" class="mono" font-size="8" fill="#8b949e">2-way duplex link: ok</text>

          <!-- Audio Frequency Bars -->
          <g transform="translate(235, 22)">
            <rect x="0" y="10" width="5" height="18" fill="#ff8a3d" />
            <rect x="12" y="3" width="5" height="25" fill="#ff8a3d" />
            <rect x="24" y="0" width="5" height="28" fill="#58a6ff" />
            <rect x="36" y="8" width="5" height="20" fill="#58a6ff" />
            <rect x="48" y="12" width="5" height="16" fill="#ff8a3d" />
            <rect x="60" y="5" width="5" height="23" fill="#ff8a3d" />
            <rect x="72" y="14" width="5" height="14" fill="#8b949e" />
            <rect x="84" y="10" width="5" height="18" fill="#ff8a3d" />
            <rect x="96" y="2" width="5" height="26" fill="#58a6ff" />
            <rect x="108" y="11" width="5" height="17" fill="#ff8a3d" />
            <rect x="120" y="15" width="5" height="13" fill="#8b949e" />
          </g>

          <line x1="375" y1="18" x2="375" y2="56" stroke="#30363d" stroke-width="1" />
          <circle cx="405" cy="37" r="8" fill="#161b22" stroke="#ff8a3d" stroke-width="2" />
          <circle cx="405" cy="37" r="3.5" fill="#ff8a3d" />
        </g>
      

    <!-- Content Area: Name & Factual Description -->
    <text x="18" y="156" class="mono card-title">NEMESIS</text>
    <text x="18" y="176" class="mono card-desc">Autonomous dual-loop voice assistant and security testing en...</text>
    <text x="18" y="194" class="mono card-desc">vironment</text>

    <!-- Technology Tags -->
    
      <g transform="translate(18, 232)">
        <rect width="58" height="22" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
        <text x="29" y="15" text-anchor="middle" class="mono" font-size="10" fill="#e6edf3">Python</text>
      </g>

      <g transform="translate(84, 232)">
        <rect width="108" height="22" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
        <text x="54" y="15" text-anchor="middle" class="mono" font-size="10" fill="#e6edf3">Faster-Whisper</text>
      </g>

      <g transform="translate(200, 232)">
        <rect width="54" height="22" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
        <text x="27" y="15" text-anchor="middle" class="mono" font-size="10" fill="#e6edf3">CUDA</text>
      </g>

    <!-- Access CTA Button -->
    <g transform="translate(390, 232)">
      <rect width="72" height="22" rx="4" fill="#0d1117" stroke="#ff8a3d" stroke-width="1.2" />
      <text x="36" y="15" text-anchor="middle" class="mono card-link">VIEW ↗</text>
    </g>
  </a>
</svg>