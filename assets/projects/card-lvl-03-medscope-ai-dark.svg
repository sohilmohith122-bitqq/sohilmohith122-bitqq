<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="440" height="240">
  <title>MEDSCOPE-AI - LVL 03</title>
  <desc>Evidence-first clinical event timeline and health records engine</desc>

  <style>
    
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .bold { font-weight: 700; }
    
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .cursor-blink {
      animation: blink 0.9s infinite step-start;
    }
    .node-pulse {
      animation: pulseNode 3s infinite ease-in-out;
      transform-origin: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor-blink, .node-pulse, * {
        animation: none !important;
        transition: none !important;
      }
    }
  
    .card-title { font-size: 14px; font-weight: 700; fill: #e6edf3; letter-spacing: 0.5px; }
    .card-desc { font-size: 11px; fill: #8b949e; }
    .card-link { font-size: 11px; font-weight: 700; fill: #b7ff3c; }
  </style>

  <a href="https://github.com/sohilmohith122-bitqq/MEDSCOPE-AI" target="_blank" rel="noopener noreferrer">
    <!-- Card Outer Frame -->
    <rect x="1" y="1" width="438" height="238" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2" />
    <rect x="3" y="3" width="434" height="234" rx="6" fill="none" stroke="#b7ff3c" stroke-opacity="0.12" stroke-width="1" />

    <!-- Top Navigation Bar -->
    <rect x="2" y="2" width="436" height="36" rx="6" fill="#0d1117" />
    <line x1="2" y1="38" x2="438" y2="38" stroke="#30363d" stroke-width="1.5" />

    <!-- Pixel Cursor & Level Identifier -->
    <g transform="translate(16, 11) scale(1)">
    <!-- Outer Corner Brackets (2px flat pixel strokes) -->
    <rect x="0" y="0" width="4" height="2" fill="#b7ff3c" />
    <rect x="0" y="2" width="2" height="2" fill="#b7ff3c" />

    <rect x="12" y="0" width="4" height="2" fill="#b7ff3c" />
    <rect x="14" y="2" width="2" height="2" fill="#b7ff3c" />

    <rect x="0" y="14" width="4" height="2" fill="#b7ff3c" />
    <rect x="0" y="12" width="2" height="2" fill="#b7ff3c" />

    <rect x="12" y="14" width="4" height="2" fill="#b7ff3c" />
    <rect x="14" y="12" width="2" height="2" fill="#b7ff3c" />

    <!-- Center Geometric Core Node -->
    <rect x="6" y="6" width="4" height="4" fill="#58a6ff" />
  </g>
    <text x="40" y="22" class="mono bold" font-size="11" fill="#b7ff3c">LVL 03</text>
    <text x="105" y="22" class="mono" font-size="11" fill="#8b949e">// COLLECTIBLE REPO</text>

    <!-- Status Indicator -->
    <circle cx="410" cy="20" r="3.5" fill="#b7ff3c" />
    <text x="400" y="23" text-anchor="end" class="mono bold" font-size="10" fill="#8b949e">ACTIVE</text>

    <!-- 2D Vector Motif Scene -->
    
        <g transform="translate(18, 52)">
          <rect width="404" height="64" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
          <!-- Browser Header Bar -->
          <rect x="25" y="12" width="354" height="14" rx="2" fill="#161b22" stroke="#30363d" stroke-width="1" />
          <circle cx="34" cy="19" r="2" fill="#f778ba" />
          <circle cx="42" cy="19" r="2" fill="#ff8a3d" />
          <circle cx="50" cy="19" r="2" fill="#b7ff3c" />
          
          <!-- Chronological Anchors -->
          <line x1="45" y1="44" x2="360" y2="44" stroke="#30363d" stroke-width="2" />
          <rect x="75" y="38" width="12" height="12" rx="2" fill="#b7ff3c" />
          <rect x="165" y="38" width="12" height="12" rx="2" fill="#58a6ff" />
          <rect x="255" y="38" width="12" height="12" rx="2" fill="#bc8cff" />
          <rect x="330" y="38" width="12" height="12" rx="2" fill="#b7ff3c" />
        </g>
      

    <!-- Content Area: Name & Factual Description -->
    <text x="18" y="142" class="mono card-title">MEDSCOPE-AI</text>
    <text x="18" y="162" class="mono card-desc">Evidence-first clinical event timeline and health recor...</text>
    <text x="18" y="178" class="mono card-desc">ds engine</text>

    <!-- Technology Tags -->
    
      <g transform="translate(18, 206)">
        <rect width="66" height="20" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
        <text x="33" y="14" text-anchor="middle" class="mono" font-size="10" fill="#e6edf3">Next.js</text>
      </g>

      <g transform="translate(90, 206)">
        <rect width="88" height="20" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
        <text x="44" y="14" text-anchor="middle" class="mono" font-size="10" fill="#e6edf3">TypeScript</text>
      </g>

      <g transform="translate(184, 206)">
        <rect width="58" height="20" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
        <text x="29" y="14" text-anchor="middle" class="mono" font-size="10" fill="#e6edf3">Prisma</text>
      </g>

    <!-- Access CTA Button -->
    <g transform="translate(348, 206)">
      <rect width="74" height="20" rx="4" fill="#0d1117" stroke="#b7ff3c" stroke-width="1.2" />
      <text x="37" y="14" text-anchor="middle" class="mono card-link">VIEW ↗</text>
    </g>
  </a>
</svg>