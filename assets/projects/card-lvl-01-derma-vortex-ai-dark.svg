<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="440" height="240">
  <title>DERMA-VORTEX-AI - LVL 01</title>
  <desc>Multimodal dermatological AI screening and clinical assessment platform</desc>

  <style>
    
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .bold { font-weight: 700; }
    
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .cursor-blink {
      animation: blink 0.9s infinite step-start;
    }
    .node-pulse {
      animation: pulseNode 3s infinite ease-in-out;
      transform-origin: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor-blink, .node-pulse, * {
        animation: none !important;
        transition: none !important;
      }
    }
  
    .card-title { font-size: 14px; font-weight: 700; fill: #e6edf3; letter-spacing: 0.5px; }
    .card-desc { font-size: 11px; fill: #8b949e; }
    .card-link { font-size: 11px; font-weight: 700; fill: #b7ff3c; }
  </style>

  <a href="https://github.com/sohilmohith122-bitqq/DERMA-VORTEX-AI" target="_blank" rel="noopener noreferrer">
    <!-- Card Outer Frame -->
    <rect x="1" y="1" width="438" height="238" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2" />
    <rect x="3" y="3" width="434" height="234" rx="6" fill="none" stroke="#b7ff3c" stroke-opacity="0.12" stroke-width="1" />

    <!-- Top Navigation Bar -->
    <rect x="2" y="2" width="436" height="36" rx="6" fill="#0d1117" />
    <line x1="2" y1="38" x2="438" y2="38" stroke="#30363d" stroke-width="1.5" />

    <!-- Pixel Cursor & Level Identifier -->
    <g transform="translate(16, 11) scale(1)">
    <!-- Outer Corner Brackets (2px flat pixel strokes) -->
    <rect x="0" y="0" width="4" height="2" fill="#b7ff3c" />
    <rect x="0" y="2" width="2" height="2" fill="#b7ff3c" />

    <rect x="12" y="0" width="4" height="2" fill="#b7ff3c" />
    <rect x="14" y="2" width="2" height="2" fill="#b7ff3c" />

    <rect x="0" y="14" width="4" height="2" fill="#b7ff3c" />
    <rect x="0" y="12" width="2" height="2" fill="#b7ff3c" />

    <rect x="12" y="14" width="4" height="2" fill="#b7ff3c" />
    <rect x="14" y="12" width="2" height="2" fill="#b7ff3c" />

    <!-- Center Geometric Core Node -->
    <rect x="6" y="6" width="4" height="4" fill="#58a6ff" />
  </g>
    <text x="40" y="22" class="mono bold" font-size="11" fill="#b7ff3c">LVL 01</text>
    <text x="105" y="22" class="mono" font-size="11" fill="#8b949e">// COLLECTIBLE REPO</text>

    <!-- Status Indicator -->
    <circle cx="410" cy="20" r="3.5" fill="#b7ff3c" />
    <text x="400" y="23" text-anchor="end" class="mono bold" font-size="10" fill="#8b949e">ACTIVE</text>

    <!-- 2D Vector Motif Scene -->
    
        <g transform="translate(18, 52)">
          <!-- Background Grid Plane -->
          <rect width="404" height="64" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
          
          <!-- Neural Graph Nodes & Links -->
          <line x1="40" y1="32" x2="110" y2="18" stroke="#b7ff3c" stroke-width="2" />
          <line x1="40" y1="32" x2="110" y2="46" stroke="#b7ff3c" stroke-width="2" />
          <line x1="110" y1="18" x2="190" y2="32" stroke="#b7ff3c" stroke-width="2" />
          <line x1="110" y1="46" x2="190" y2="32" stroke="#b7ff3c" stroke-width="2" />
          <line x1="190" y1="32" x2="270" y2="18" stroke="#58a6ff" stroke-width="2" />
          <line x1="190" y1="32" x2="270" y2="46" stroke="#58a6ff" stroke-width="2" />
          <line x1="270" y1="18" x2="350" y2="32" stroke="#58a6ff" stroke-width="2" />
          <line x1="270" y1="46" x2="350" y2="32" stroke="#58a6ff" stroke-width="2" />

          <!-- Nodes -->
          <circle cx="40" cy="32" r="5" fill="#b7ff3c" />
          <circle cx="110" cy="18" r="4.5" fill="#161b22" stroke="#b7ff3c" stroke-width="2" />
          <circle cx="110" cy="46" r="4.5" fill="#161b22" stroke="#b7ff3c" stroke-width="2" />
          
          <!-- Central Pulse Node -->
          <circle cx="190" cy="32" r="6" fill="#b7ff3c" class="node-pulse" />
          
          <circle cx="270" cy="18" r="4.5" fill="#161b22" stroke="#58a6ff" stroke-width="2" />
          <circle cx="270" cy="46" r="4.5" fill="#161b22" stroke="#58a6ff" stroke-width="2" />
          <circle cx="350" cy="32" r="5" fill="#58a6ff" />

          <!-- Target Scan Brackets -->
          <rect x="178" y="20" width="24" height="2" fill="#8b949e" />
          <rect x="178" y="42" width="24" height="2" fill="#8b949e" />
        </g>
      

    <!-- Content Area: Name & Factual Description -->
    <text x="18" y="142" class="mono card-title">DERMA-VORTEX-AI</text>
    <text x="18" y="162" class="mono card-desc">Multimodal dermatological AI screening and clinical ass...</text>
    <text x="18" y="178" class="mono card-desc">essment platform</text>

    <!-- Technology Tags -->
    
      <g transform="translate(18, 206)">
        <rect width="88" height="20" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
        <text x="44" y="14" text-anchor="middle" class="mono" font-size="10" fill="#e6edf3">TypeScript</text>
      </g>

      <g transform="translate(112, 206)">
        <rect width="73" height="20" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
        <text x="37" y="14" text-anchor="middle" class="mono" font-size="10" fill="#e6edf3">React 19</text>
      </g>

      <g transform="translate(191, 206)">
        <rect width="54" height="20" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
        <text x="27" y="14" text-anchor="middle" class="mono" font-size="10" fill="#e6edf3">Vite</text>
      </g>

    <!-- Access CTA Button -->
    <g transform="translate(348, 206)">
      <rect width="74" height="20" rx="4" fill="#0d1117" stroke="#b7ff3c" stroke-width="1.2" />
      <text x="37" y="14" text-anchor="middle" class="mono card-link">VIEW ↗</text>
    </g>
  </a>
</svg>