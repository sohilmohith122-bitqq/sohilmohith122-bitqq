<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <title>DERMA-VORTEX-AI - LVL 01</title>
  <desc>Multimodal dermatological AI screening and clinical assessment platform</desc>

  <style>
    
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .bold { font-weight: 700; }
    
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .cursor-blink {
      animation: blink 1s infinite step-start;
    }
    .node-pulse {
      animation: pulseNode 3s infinite ease-in-out;
      transform-origin: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor-blink, .node-pulse, * {
        animation: none !important;
        transition: none !important;
      }
    }
  
    .card-title { font-size: 15px; font-weight: 700; fill: #e6edf3; letter-spacing: 0.5px; }
    .card-desc { font-size: 11px; fill: #8b949e; }
    .card-link { font-size: 11px; font-weight: 700; fill: #b7ff3c; }
    .category-label { font-size: 9px; font-weight: 700; fill: #8b949e; letter-spacing: 1px; }
  </style>

  <a href="https://github.com/sohilmohith122-bitqq/DERMA-VORTEX-AI" target="_blank" rel="noopener noreferrer">
    <!-- Card Outer Frame -->
    <rect x="1" y="1" width="478" height="268" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2" />
    <rect x="3" y="3" width="474" height="264" rx="6" fill="none" stroke="#b7ff3c" stroke-opacity="0.12" stroke-width="1" />

    <!-- Top Technical Banner -->
    <rect x="2" y="2" width="476" height="38" rx="6" fill="#0d1117" />
    <line x1="2" y1="40" x2="478" y2="40" stroke="#30363d" stroke-width="1.5" />

    <!-- Brand Symbol Sequence Badge -->
    <g transform="translate(14, 11) scale(0.1875)">
    <!-- 8px Grid Outer Corner Brackets (Cells 1,1; 10,1; 1,10; 10,10) -->
    <!-- Top-Left -->
    <rect x="8" y="8" width="16" height="8" fill="#30363d" />
    <rect x="8" y="16" width="8" height="16" fill="#30363d" />

    <!-- Top-Right -->
    <rect x="72" y="8" width="16" height="8" fill="#30363d" />
    <rect x="80" y="16" width="8" height="16" fill="#30363d" />

    <!-- Bottom-Left -->
    <rect x="8" y="80" width="16" height="8" fill="#30363d" />
    <rect x="8" y="64" width="8" height="16" fill="#30363d" />

    <!-- Bottom-Right -->
    <rect x="72" y="80" width="16" height="8" fill="#30363d" />
    <rect x="80" y="64" width="8" height="16" fill="#30363d" />

    <!-- Terminal Chevron '>' Silhouette (Cells 3,3 to 6,5 to 3,8) -->
    <rect x="24" y="24" width="8" height="8" fill="#58a6ff" />
    <rect x="32" y="32" width="8" height="8" fill="#58a6ff" />
    <rect x="40" y="40" width="8" height="8" fill="#58a6ff" />
    <rect x="48" y="40" width="8" height="8" fill="#58a6ff" />
    <rect x="40" y="48" width="8" height="8" fill="#58a6ff" />
    <rect x="32" y="56" width="8" height="8" fill="#58a6ff" />
    <rect x="24" y="64" width="8" height="8" fill="#58a6ff" />

    <!-- The Signature Lime-Green Signal Block (16x16: Cells 7,6 & 8,6) -->
    <rect x="56" y="48" width="16" height="16" rx="2" fill="#b7ff3c" class="node-pulse" />

    

    <!-- Auxiliary Data Node (Cell 8,9) -->
    <rect x="64" y="72" width="8" height="8" rx="1" fill="#8b949e" />
  </g>
    <text x="38" y="24" class="mono bold" font-size="11" fill="#b7ff3c">LVL 01</text>
    <text x="100" y="24" class="mono category-label">// APPLIED_AI / COMPUTER_VISION</text>

    <!-- Active Indicator -->
    <circle cx="452" cy="21" r="3.5" fill="#b7ff3c" />
    <text x="442" y="24" text-anchor="end" class="mono bold" font-size="9" fill="#8b949e">ONLINE</text>

    <!-- 2D Vector Motif Scene -->
    
        <g transform="translate(18, 52)">
          <rect width="444" height="74" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
          
          <!-- Neural Graph Nodes & Links -->
          <line x1="45" y1="37" x2="120" y2="20" stroke="#b7ff3c" stroke-width="2" />
          <line x1="45" y1="37" x2="120" y2="54" stroke="#b7ff3c" stroke-width="2" />
          <line x1="120" y1="20" x2="210" y2="37" stroke="#b7ff3c" stroke-width="2" />
          <line x1="120" y1="54" x2="210" y2="37" stroke="#b7ff3c" stroke-width="2" />
          <line x1="210" y1="37" x2="300" y2="20" stroke="#58a6ff" stroke-width="2" />
          <line x1="210" y1="37" x2="300" y2="54" stroke="#58a6ff" stroke-width="2" />
          <line x1="300" y1="20" x2="390" y2="37" stroke="#58a6ff" stroke-width="2" />
          <line x1="300" y1="54" x2="390" y2="37" stroke="#58a6ff" stroke-width="2" />

          <!-- Nodes -->
          <circle cx="45" cy="37" r="5.5" fill="#b7ff3c" />
          <circle cx="120" cy="20" r="5" fill="#161b22" stroke="#b7ff3c" stroke-width="2" />
          <circle cx="120" cy="54" r="5" fill="#161b22" stroke="#b7ff3c" stroke-width="2" />
          
          <!-- Central Pulse Node -->
          <circle cx="210" cy="37" r="7" fill="#b7ff3c" class="node-pulse" />
          
          <circle cx="300" cy="20" r="5" fill="#161b22" stroke="#58a6ff" stroke-width="2" />
          <circle cx="300" cy="54" r="5" fill="#161b22" stroke="#58a6ff" stroke-width="2" />
          <circle cx="390" cy="37" r="5.5" fill="#58a6ff" />

          <!-- Target Scan Brackets -->
          <rect x="196" y="22" width="28" height="2" fill="#8b949e" />
          <rect x="196" y="50" width="28" height="2" fill="#8b949e" />
        </g>
      

    <!-- Content Area: Name & Factual Description -->
    <text x="18" y="156" class="mono card-title">DERMA-VORTEX-AI</text>
    <text x="18" y="176" class="mono card-desc">Multimodal dermatological AI screening and clinical assessme...</text>
    <text x="18" y="194" class="mono card-desc">nt platform</text>

    <!-- Technology Tags -->
    
      <g transform="translate(18, 232)">
        <rect width="88" height="22" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
        <text x="44" y="15" text-anchor="middle" class="mono" font-size="10" fill="#e6edf3">TypeScript</text>
      </g>

      <g transform="translate(114, 232)">
        <rect width="73" height="22" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
        <text x="37" y="15" text-anchor="middle" class="mono" font-size="10" fill="#e6edf3">React 19</text>
      </g>

      <g transform="translate(195, 232)">
        <rect width="54" height="22" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
        <text x="27" y="15" text-anchor="middle" class="mono" font-size="10" fill="#e6edf3">Vite</text>
      </g>

    <!-- Access CTA Button -->
    <g transform="translate(390, 232)">
      <rect width="72" height="22" rx="4" fill="#0d1117" stroke="#b7ff3c" stroke-width="1.2" />
      <text x="36" y="15" text-anchor="middle" class="mono card-link">VIEW ↗</text>
    </g>
  </a>
</svg>