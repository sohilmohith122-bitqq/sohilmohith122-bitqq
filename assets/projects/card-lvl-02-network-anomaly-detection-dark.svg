    <text x="442" y="24" text-anchor="end" class="mono bold" font-size="9" fill="#8b949e">ONLINE</text>

    <!-- 2D Vector Motif Scene -->
    
        <g transform="translate(18, 52)">
          <rect width="444" height="74" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
          <!-- Server Module Unit -->
          <rect x="25" y="16" width="80" height="42" rx="3" fill="#161b22" stroke="#ff8a3d" stroke-width="1.5" />
          <line x1="33" y1="28" x2="75" y2="28" stroke="#8b949e" stroke-width="1.5" />
          <line x1="33" y1="38" x2="65" y2="38" stroke="#8b949e" stroke-width="1.5" />
