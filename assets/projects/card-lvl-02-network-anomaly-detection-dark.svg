            <rect x="32" y="8" width="8" height="34" fill="#ff8a3d" />
            <rect x="48" y="22" width="8" height="20" fill="#ff8a3d" />
            <rect x="64" y="4" width="8" height="38" fill="#f778ba" />
            <rect x="80" y="16" width="8" height="26" fill="#ff8a3d" />
            <rect x="96" y="30" width="8" height="12" fill="#8b949e" />
          </g>

          <!-- Waveform Stream -->
          <path d="M 270,37 L 305,37 L 315,16 L 332,58 L 350,22 L 368,37 L 420,37" fill="none" stroke="#ff8a3d" stroke-width="2" />
        </g>
      

    <!-- Content Area: Name & Factual Description -->
    <text x="18" y="156" class="mono card-title">Network-Anomaly-Detection</text>
    <text x="18" y="176" class="mono card-desc">Real-time telemetry analysis and network anomaly detection p...</text>
    <text x="18" y="194" class="mono card-desc">ipeline</text>

    <!-- Technology Tags -->
    
      <g transform="translate(18, 232)">
        <rect width="58" height="22" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
        <text x="29" y="15" text-anchor="middle" class="mono" font-size="10" fill="#e6edf3">Python</text>
      </g>

      <g transform="translate(84, 232)">
        <rect width="66" height="22" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
