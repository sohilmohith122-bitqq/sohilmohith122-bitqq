<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="100%" height="310">
  <defs>
    <!-- Dark Glass Linear Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e141d" />
      <stop offset="100%" stop-color="#0a0e14" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f1620" />
      <stop offset="100%" stop-color="#141c28" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .term-title { font-size: 12px; fill: #5c6b7a; letter-spacing: 0.5px; }
  </style>

  <!-- Terminal Body Frame -->
  <rect x="1" y="1" width="798" height="308" rx="8" fill="url(#termBg)" stroke="#1a2433" stroke-width="1.5" />
  <rect x="2" y="2" width="796" height="306" rx="7" fill="none" stroke="#00ff9c" stroke-opacity="0.15" stroke-width="1" />

  <!-- Terminal Window Header -->
  <path d="M 1,9 A 8,8 0 0 1 9,1 L 791,1 A 8,8 0 0 1 799,9 L 799,32 L 1,32 Z" fill="url(#headerGrad)" />
  <line x1="1" y1="32" x2="799" y2="32" stroke="#1c2736" stroke-width="1" />

  <!-- 3 Chrome Controls -->
  <circle cx="18" cy="16" r="4.5" fill="#ff5370" />
  <circle cx="34" cy="16" r="4.5" fill="#ffb86b" />
  <circle cx="50" cy="16" r="4.5" fill="#00ff9c" />

  <!-- Title -->
  <text x="400" y="20" text-anchor="middle" class="mono term-title">sohil@operator: ~/neofetch</text>

  <!-- Matrix Background (Optional) -->
  

  <!-- Main Content Group -->
  <g transform="translate(0, 32)">
    
    <!-- Header identity line -->
    <text x="190" y="24" class="mono" font-size="15" font-weight="bold" fill="#00ff9c">sohilmohith122-bitqq<tspan fill="#5c6b7a">@</tspan><tspan fill="#b26bff">operator</tspan></text>
    <line x1="190" y1="34" x2="480" y2="34" stroke="#1c2736" stroke-width="1.5" />

    <!-- ASCII Emblem -->
    <text x="35" y="60" class="mono" font-size="13" font-weight="bold" fill="#00ff9c">    .----.</text>
<text x="35" y="78" class="mono" font-size="13" font-weight="bold" fill="#00ff9c">   /  --  \</text>
<text x="35" y="96" class="mono" font-size="13" font-weight="bold" fill="#00ff9c">  |  (..)  |</text>
<text x="35" y="114" class="mono" font-size="13" font-weight="bold" fill="#00ff9c">  |   ==   |</text>
<text x="35" y="132" class="mono" font-size="13" font-weight="bold" fill="#00ff9c">   \  __  /</text>
<text x="35" y="150" class="mono" font-size="13" font-weight="bold" fill="#00ff9c">    `----`</text>
<text x="35" y="168" class="mono" font-size="13" font-weight="bold" fill="#00ff9c">   [CYBER]</text>
<text x="35" y="186" class="mono" font-size="13" font-weight="bold" fill="#00ff9c">   [SH-01]</text>

    <!-- Neofetch Spec List -->
    <g transform="translate(190, 58)">
      <text x="0" y="0" class="mono" font-size="12" font-weight="bold" fill="#22e6ff">OS:</text>
      <text x="95" y="0" class="mono" font-size="12" fill="#c9d1d9">Windows + WSL2 (Ubuntu)</text>
    </g>
<g transform="translate(190, 78)">
      <text x="0" y="0" class="mono" font-size="12" font-weight="bold" fill="#22e6ff">Host:</text>
      <text x="95" y="0" class="mono" font-size="12" fill="#c9d1d9">Dev Station (x86_64)</text>
    </g>
<g transform="translate(190, 98)">
      <text x="0" y="0" class="mono" font-size="12" font-weight="bold" fill="#22e6ff">Kernel:</text>
      <text x="95" y="0" class="mono" font-size="12" fill="#c9d1d9">Linux 6.x / Cloud Native</text>
    </g>
<g transform="translate(190, 118)">
      <text x="0" y="0" class="mono" font-size="12" font-weight="bold" fill="#22e6ff">Uptime:</text>
      <text x="95" y="0" class="mono" font-size="12" fill="#c9d1d9">since day 1</text>
    </g>
<g transform="translate(190, 138)">
      <text x="0" y="0" class="mono" font-size="12" font-weight="bold" fill="#22e6ff">Shell:</text>
      <text x="95" y="0" class="mono" font-size="12" fill="#c9d1d9">bash</text>
    </g>
<g transform="translate(190, 158)">
      <text x="0" y="0" class="mono" font-size="12" font-weight="bold" fill="#22e6ff">Editor:</text>
      <text x="95" y="0" class="mono" font-size="12" fill="#c9d1d9">VS Code</text>
    </g>
<g transform="translate(190, 178)">
      <text x="0" y="0" class="mono" font-size="12" font-weight="bold" fill="#22e6ff">Languages:</text>
      <text x="95" y="0" class="mono" font-size="12" fill="#c9d1d9">Python, JavaScript, TypeScript, HTML</text>
    </g>
<g transform="translate(190, 198)">
      <text x="0" y="0" class="mono" font-size="12" font-weight="bold" fill="#22e6ff">Base:</text>
      <text x="95" y="0" class="mono" font-size="12" fill="#c9d1d9">Tamil Nadu, India (IST)</text>
    </g>
<g transform="translate(190, 218)">
      <text x="0" y="0" class="mono" font-size="12" font-weight="bold" fill="#22e6ff">Status:</text>
      <text x="95" y="0" class="mono" font-size="12" fill="#c9d1d9">Open to internships, collabs and open-source contributions</text>
    </g>

    <!-- Terminal Color Palette Palette -->
    <rect x="190" y="246" width="16" height="10" rx="2" fill="#0a0e14" stroke="#1c2736" stroke-width="1" />
<rect x="212" y="246" width="16" height="10" rx="2" fill="#ff5370" stroke="#1c2736" stroke-width="1" />
<rect x="234" y="246" width="16" height="10" rx="2" fill="#00ff9c" stroke="#1c2736" stroke-width="1" />
<rect x="256" y="246" width="16" height="10" rx="2" fill="#ffb86b" stroke="#1c2736" stroke-width="1" />
<rect x="278" y="246" width="16" height="10" rx="2" fill="#22e6ff" stroke="#1c2736" stroke-width="1" />
<rect x="300" y="246" width="16" height="10" rx="2" fill="#b26bff" stroke="#1c2736" stroke-width="1" />
<rect x="322" y="246" width="16" height="10" rx="2" fill="#c9d1d9" stroke="#1c2736" stroke-width="1" />
<rect x="344" y="246" width="16" height="10" rx="2" fill="#5c6b7a" stroke="#1c2736" stroke-width="1" />
  
  </g>

  <!-- Scanlines Overlay (Optional) -->
  
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100%" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.25" />
    </pattern>
    <rect width="800" height="310" fill="url(#scanlines)" pointer-events="none" />
</svg>