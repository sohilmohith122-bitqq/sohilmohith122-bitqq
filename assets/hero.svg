<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260">
  <title>Terminal Boot Sequence - Sohil Mohith</title>
  <desc>Animated terminal window displaying boot sequence, whoami command, and operator identity.</desc>

  <defs>
    <!-- Terminal Background -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1622" />
      <stop offset="100%" stop-color="#0a0e14" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="heroScan" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100%" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.22" />
    </pattern>

    <!-- Typewriter Clip Path for '$ whoami' -->
    <clipPath id="whoamiClip">
      <rect x="36" y="112" width="0" height="22">
        <animate attributeName="width" values="0; 0; 120; 120; 120" keyTimes="0; 0.25; 0.40; 0.95; 1" dur="7s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Glitch Keyframes -->
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
      
      @keyframes glitchCyan {
        0%, 100% { transform: translate(0, 0); opacity: 0; }
        92% { transform: translate(0, 0); opacity: 0; }
        93% { transform: translate(-2px, 1px); opacity: 0.75; }
        94% { transform: translate(1px, -1px); opacity: 0.8; }
        95% { transform: translate(0, 0); opacity: 0; }
        97% { transform: translate(-3px, 0px); opacity: 0.9; }
        98% { transform: translate(0, 0); opacity: 0; }
      }

      @keyframes glitchRed {
        0%, 100% { transform: translate(0, 0); opacity: 0; }
        92% { transform: translate(0, 0); opacity: 0; }
        93.5% { transform: translate(2px, -1px); opacity: 0.7; }
        94.5% { transform: translate(-1px, 1px); opacity: 0.75; }
        95.5% { transform: translate(0, 0); opacity: 0; }
        97.5% { transform: translate(3px, 1px); opacity: 0.85; }
        98.5% { transform: translate(0, 0); opacity: 0; }
      }

      .glitch-cyan {
        animation: glitchCyan 4s infinite linear;
      }
      .glitch-red {
        animation: glitchRed 4s infinite linear;
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect x="1" y="1" width="848" height="258" rx="8" fill="url(#heroBg)" stroke="#1a2536" stroke-width="1.5" />
  <rect x="2" y="2" width="846" height="256" rx="7" fill="none" stroke="#00ff9c" stroke-opacity="0.12" stroke-width="1" />

  <!-- Terminal Window Chrome Header -->
  <path d="M 1,9 A 8,8 0 0 1 9,1 L 841,1 A 8,8 0 0 1 849,9 L 849,32 L 1,32 Z" fill="#0f1620" />
  <line x1="1" y1="32" x2="849" y2="32" stroke="#1c2736" stroke-width="1" />

  <!-- Chrome Controls -->
  <circle cx="20" cy="16" r="4.5" fill="#ff5370" />
  <circle cx="36" cy="16" r="4.5" fill="#ffb86b" />
  <circle cx="52" cy="16" r="4.5" fill="#00ff9c" />

  <!-- Window Title -->
  <text x="425" y="20" text-anchor="middle" class="mono" font-size="12" fill="#5c6b7a" letter-spacing="0.5px">sohil@dev: ~</text>

  <!-- Matrix Rain Faint Trails (Staggered) -->
  <g opacity="0.06" class="mono" font-size="11" fill="#00ff9c">
    <text x="65" y="0">
      <animateTransform attributeName="transform" type="translate" values="0,-30; 0,280" dur="4.2s" repeatCount="indefinite" />
      0 1 0 0 1 0 1 1
    </text>
    <text x="175" y="0">
      <animateTransform attributeName="transform" type="translate" values="0,-30; 0,280" dur="5.0s" begin="-1.5s" repeatCount="indefinite" />
      1 0 1 1 0 0 1 0
    </text>
    <text x="320" y="0">
      <animateTransform attributeName="transform" type="translate" values="0,-30; 0,280" dur="3.8s" begin="-2.2s" repeatCount="indefinite" />
      &lt; / &gt; { } = + -
    </text>
    <text x="470" y="0">
      <animateTransform attributeName="transform" type="translate" values="0,-30; 0,280" dur="4.6s" begin="-0.8s" repeatCount="indefinite" />
      0 0 1 1 0 1 0 1
    </text>
    <text x="610" y="0">
      <animateTransform attributeName="transform" type="translate" values="0,-30; 0,280" dur="5.2s" begin="-3.1s" repeatCount="indefinite" />
      1 1 0 1 0 0 1 1
    </text>
    <text x="740" y="0">
      <animateTransform attributeName="transform" type="translate" values="0,-30; 0,280" dur="4.0s" begin="-1.8s" repeatCount="indefinite" />
      0 1 1 0 1 1 0 0
    </text>
  </g>

  <!-- Boot Log Sequence (Appears sequentially) -->
  <g class="mono" font-size="12">
    <!-- Log Line 1: Mounting /dev/skills -->
    <g>
      <animate attributeName="opacity" values="0; 1; 1" keyTimes="0; 0.05; 1" dur="7s" repeatCount="indefinite" />
      <text x="36" y="60" fill="#00ff9c">[ OK ]</text>
      <text x="88" y="60" fill="#c9d1d9">mounting /dev/skills</text>
    </g>

    <!-- Log Line 2: Loading projects -->
    <g>
      <animate attributeName="opacity" values="0; 0; 1; 1" keyTimes="0; 0.08; 0.12; 1" dur="7s" repeatCount="indefinite" />
      <text x="36" y="80" fill="#00ff9c">[ OK ]</text>
      <text x="88" y="80" fill="#c9d1d9">loading projects</text>
    </g>

    <!-- Log Line 3: Caffeine low warning -->
    <g>
      <animate attributeName="opacity" values="0; 0; 1; 1" keyTimes="0; 0.15; 0.20; 1" dur="7s" repeatCount="indefinite" />
      <text x="36" y="100" fill="#ffb86b">[WARN]</text>
      <text x="88" y="100" fill="#c9d1d9">caffeine low -- replenishing from chai.daemon</text>
    </g>
  </g>

  <!-- Prompt Command: $ whoami (Typewriter Effect) -->
  <g class="mono" font-size="14" font-weight="bold">
    <text x="36" y="128" fill="#22e6ff">$ whoami</text>
    <!-- Blinking Cursor -->
    <rect x="110" y="116" width="8" height="15" fill="#00ff9c">
      <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.5; 0.51; 1" dur="0.8s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Operator Identity: SOHIL MOHITH with Glitch Motion -->
  <g transform="translate(36, 185)">
    <!-- Cyan Glitch Offset Layer -->
    <text x="0" y="0" class="mono glitch-cyan" font-size="44" font-weight="900" fill="#22e6ff" letter-spacing="2px">SOHIL MOHITH</text>
    <!-- Red Glitch Offset Layer -->
    <text x="0" y="0" class="mono glitch-red" font-size="44" font-weight="900" fill="#ff5370" letter-spacing="2px">SOHIL MOHITH</text>
    <!-- Main Green Layer -->
    <text x="0" y="0" class="mono" font-size="44" font-weight="900" fill="#00ff9c" letter-spacing="2px">SOHIL MOHITH</text>
  </g>

  <!-- Operator Role and System Status -->
  <g transform="translate(36, 222)">
    <text x="0" y="0" class="mono" font-size="14" font-weight="bold" fill="#22e6ff">&gt; Aspiring Full-Stack Developer</text>
    <text x="320" y="0" class="mono" font-size="13" fill="#5c6b7a">// Building things, breaking them, learning why.</text>
  </g>

  <!-- Scanline Overlay -->
  <rect width="850" height="260" fill="url(#heroScan)" pointer-events="none" />
</svg>
