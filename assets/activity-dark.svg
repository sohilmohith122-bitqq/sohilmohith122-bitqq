<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" width="100%" height="150">
  <title>12-Week Commit Velocity Heatmap</title>
  <desc>Chronological distribution of commits over the previous 12 weeks totaling 52 contributions.</desc>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .bold { font-weight: 700; }
    
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .cursor-blink {
      animation: blink 1s infinite step-start;
    }
    .node-pulse {
      animation: pulseNode 3s infinite ease-in-out;
      transform-origin: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor-blink, .node-pulse, * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>

  <rect x="1" y="1" width="958" height="148" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="2" />

