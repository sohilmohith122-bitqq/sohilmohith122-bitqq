<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 56" width="160" height="56">
  <title>JavaScript</title>
  <desc>Flat 2D skill tile for JavaScript</desc>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .bold { font-weight: 700; }
    
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .cursor-blink {
      animation: blink 0.9s infinite step-start;
    }
    .node-pulse {
      animation: pulseNode 3s infinite ease-in-out;
      transform-origin: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor-blink, .node-pulse, * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>

  <rect x="1" y="1" width="158" height="54" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" />
  
        <rect x="16" y="14" width="32" height="22" rx="3" fill="#ffffff" stroke="#0969da" stroke-width="1.5" />
        <text x="21" y="27" class="mono bold" font-size="10" fill="#0969da">&gt;_</text>
      

  <g transform="translate(58, 24)">
    <text x="0" y="0" class="mono bold" font-size="11" fill="#1f2328">JavaScript</text>
    <text x="0" y="14" class="mono" font-size="9" fill="#656d76">LANGUAGE</text>
  </g>
</svg>