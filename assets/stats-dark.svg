<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 140" width="100%" height="140">
  <title>GitHub Telemetry Metrics</title>
  <desc>Verified public repository metrics including repositories, stars, commits, and followers.</desc>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .bold { font-weight: 700; }
    
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .cursor-blink {
      animation: blink 0.9s infinite step-start;
    }
    .node-pulse {
      animation: pulseNode 3s infinite ease-in-out;
      transform-origin: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor-blink, .node-pulse, * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>

  <rect x="1" y="1" width="958" height="138" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="2" />
  
    <g transform="translate(24, 24)">
      <rect width="216" height="92" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <rect x="16" y="14" width="8" height="8" rx="2" fill="#58a6ff" />
      <text x="32" y="22" class="mono" font-size="9" font-weight="700" fill="#8b949e">PUBLIC REPOSITORIES</text>
      <text x="16" y="66" class="mono bold" font-size="30" fill="#e6edf3">11</text>
      <text x="16" y="80" class="mono" font-size="8" fill="#8b949e">VERIFIED GITHUB TELEMETRY</text>
    </g>

    <g transform="translate(254, 24)">
      <rect width="216" height="92" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <rect x="16" y="14" width="8" height="8" rx="2" fill="#ff8a3d" />
      <text x="32" y="22" class="mono" font-size="9" font-weight="700" fill="#8b949e">PUBLIC STARS</text>
      <text x="16" y="66" class="mono bold" font-size="30" fill="#e6edf3">0</text>
      <text x="16" y="80" class="mono" font-size="8" fill="#8b949e">VERIFIED GITHUB TELEMETRY</text>
    </g>

    <g transform="translate(484, 24)">
      <rect width="216" height="92" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <rect x="16" y="14" width="8" height="8" rx="2" fill="#b7ff3c" />
      <text x="32" y="22" class="mono" font-size="9" font-weight="700" fill="#8b949e">EST. ANNUAL COMMITS</text>
      <text x="16" y="66" class="mono bold" font-size="30" fill="#e6edf3">320</text>
      <text x="16" y="80" class="mono" font-size="8" fill="#8b949e">VERIFIED GITHUB TELEMETRY</text>
    </g>

    <g transform="translate(714, 24)">
      <rect width="216" height="92" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <rect x="16" y="14" width="8" height="8" rx="2" fill="#bc8cff" />
      <text x="32" y="22" class="mono" font-size="9" font-weight="700" fill="#8b949e">COMMUNITY FOLLOWERS</text>
      <text x="16" y="66" class="mono bold" font-size="30" fill="#e6edf3">1</text>
      <text x="16" y="80" class="mono" font-size="8" fill="#8b949e">VERIFIED GITHUB TELEMETRY</text>
    </g>
</svg>