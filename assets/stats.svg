<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="260">
  <defs>
    <!-- Dark Glass Linear Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e141d" />
      <stop offset="100%" stop-color="#0a0e14" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f1620" />
      <stop offset="100%" stop-color="#141c28" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .term-title { font-size: 12px; fill: #5c6b7a; letter-spacing: 0.5px; }
  </style>

  <!-- Terminal Body Frame -->
  <rect x="1" y="1" width="798" height="258" rx="8" fill="url(#termBg)" stroke="#1a2433" stroke-width="1.5" />
  <rect x="2" y="2" width="796" height="256" rx="7" fill="none" stroke="#22e6ff" stroke-opacity="0.15" stroke-width="1" />

  <!-- Terminal Window Header -->
  <path d="M 1,9 A 8,8 0 0 1 9,1 L 791,1 A 8,8 0 0 1 799,9 L 799,32 L 1,32 Z" fill="url(#headerGrad)" />
  <line x1="1" y1="32" x2="799" y2="32" stroke="#1c2736" stroke-width="1" />

  <!-- 3 Chrome Controls -->
  <circle cx="18" cy="16" r="4.5" fill="#ff5370" />
  <circle cx="34" cy="16" r="4.5" fill="#ffb86b" />
  <circle cx="50" cy="16" r="4.5" fill="#00ff9c" />

  <!-- Title -->
  <text x="400" y="20" text-anchor="middle" class="mono term-title">sohil@stats: ~/metrics</text>

  <!-- Matrix Background (Optional) -->
  

  <!-- Main Content Group -->
  <g transform="translate(0, 32)">
    
    <!-- Left Column: Metrics -->
    <g transform="translate(35, 25)">
      <rect width="250" height="38" rx="6" fill="#111823" stroke="#1a2535" stroke-width="1" />
      <text x="16" y="24" class="mono" font-size="11" font-weight="bold" fill="#5c6b7a">PUBLIC REPOS</text>
      <text x="234" y="24" text-anchor="end" class="mono" font-size="15" font-weight="bold" fill="#22e6ff">11</text>
    </g>
<g transform="translate(35, 73)">
      <rect width="250" height="38" rx="6" fill="#111823" stroke="#1a2535" stroke-width="1" />
      <text x="16" y="24" class="mono" font-size="11" font-weight="bold" fill="#5c6b7a">STARS EARNED</text>
      <text x="234" y="24" text-anchor="end" class="mono" font-size="15" font-weight="bold" fill="#ffb86b">0</text>
    </g>
<g transform="translate(35, 121)">
      <rect width="250" height="38" rx="6" fill="#111823" stroke="#1a2535" stroke-width="1" />
      <text x="16" y="24" class="mono" font-size="11" font-weight="bold" fill="#5c6b7a">TOTAL COMMITS (1Y)</text>
      <text x="234" y="24" text-anchor="end" class="mono" font-size="15" font-weight="bold" fill="#00ff9c">240</text>
    </g>
<g transform="translate(35, 169)">
      <rect width="250" height="38" rx="6" fill="#111823" stroke="#1a2535" stroke-width="1" />
      <text x="16" y="24" class="mono" font-size="11" font-weight="bold" fill="#5c6b7a">FOLLOWERS</text>
      <text x="234" y="24" text-anchor="end" class="mono" font-size="15" font-weight="bold" fill="#b26bff">1</text>
    </g>

    <!-- Divider Line -->
    <line x1="305" y1="20" x2="305" y2="215" stroke="#1a2535" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Right Column: Language Distribution -->
    <text x="330" y="16" class="mono" font-size="11" font-weight="bold" fill="#5c6b7a">TOP LANGUAGES (CODE DISTRIBUTION)</text>
    <g transform="translate(330, 28)">
    <text x="0" y="11" class="mono" font-size="12" fill="#c9d1d9">Python</text>
    <text x="385" y="11" text-anchor="end" class="mono" font-size="11" fill="#5c6b7a">54%</text>
    <rect x="0" y="18" width="385" height="5" rx="2.5" fill="#141c28" />
    <rect x="0" y="18" width="173" height="5" rx="2.5" fill="#3572A5">
      <animate attributeName="width" from="0" to="173" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
    </rect>
  </g>
<g transform="translate(330, 64)">
    <text x="0" y="11" class="mono" font-size="12" fill="#c9d1d9">JavaScript</text>
    <text x="385" y="11" text-anchor="end" class="mono" font-size="11" fill="#5c6b7a">44%</text>
    <rect x="0" y="18" width="385" height="5" rx="2.5" fill="#141c28" />
    <rect x="0" y="18" width="141" height="5" rx="2.5" fill="#f7df1e">
      <animate attributeName="width" from="0" to="141" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
    </rect>
  </g>
<g transform="translate(330, 100)">
    <text x="0" y="11" class="mono" font-size="12" fill="#c9d1d9">TypeScript</text>
    <text x="385" y="11" text-anchor="end" class="mono" font-size="11" fill="#5c6b7a">2%</text>
    <rect x="0" y="18" width="385" height="5" rx="2.5" fill="#141c28" />
    <rect x="0" y="18" width="6" height="5" rx="2.5" fill="#3178c6">
      <animate attributeName="width" from="0" to="6" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
    </rect>
  </g>
<g transform="translate(330, 136)">
    <text x="0" y="11" class="mono" font-size="12" fill="#c9d1d9">HTML</text>
    <text x="385" y="11" text-anchor="end" class="mono" font-size="11" fill="#5c6b7a">0%</text>
    <rect x="0" y="18" width="385" height="5" rx="2.5" fill="#141c28" />
    <rect x="0" y="18" width="0" height="5" rx="2.5" fill="#e34c26">
      <animate attributeName="width" from="0" to="0" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
    </rect>
  </g>
  
  </g>

  <!-- Scanlines Overlay (Optional) -->
  
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100%" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.25" />
    </pattern>
    <rect width="800" height="260" fill="url(#scanlines)" pointer-events="none" />
</svg>