<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" width="100%" height="190">
  <defs>
    <!-- Dark Glass Linear Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e141d" />
      <stop offset="100%" stop-color="#0a0e14" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f1620" />
      <stop offset="100%" stop-color="#141c28" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .term-title { font-size: 12px; fill: #5c6b7a; letter-spacing: 0.5px; }
  </style>

  <!-- Terminal Body Frame -->
  <rect x="1" y="1" width="798" height="188" rx="8" fill="url(#termBg)" stroke="#1a2433" stroke-width="1.5" />
  <rect x="2" y="2" width="796" height="186" rx="7" fill="none" stroke="#00ff9c" stroke-opacity="0.15" stroke-width="1" />

  <!-- Terminal Window Header -->
  <path d="M 1,9 A 8,8 0 0 1 9,1 L 791,1 A 8,8 0 0 1 799,9 L 799,32 L 1,32 Z" fill="url(#headerGrad)" />
  <line x1="1" y1="32" x2="799" y2="32" stroke="#1c2736" stroke-width="1" />

  <!-- 3 Chrome Controls -->
  <circle cx="18" cy="16" r="4.5" fill="#ff5370" />
  <circle cx="34" cy="16" r="4.5" fill="#ffb86b" />
  <circle cx="50" cy="16" r="4.5" fill="#00ff9c" />

  <!-- Title -->
  <text x="400" y="20" text-anchor="middle" class="mono term-title">sohil@activity: ~/sparkline</text>

  <!-- Matrix Background (Optional) -->
  

  <!-- Main Content Group -->
  <g transform="translate(0, 32)">
    
    <g transform="translate(40, 20)">
      <text x="0" y="0" class="mono" font-size="12" font-weight="bold" fill="#00ff9c">&gt; COMMIT VELOCITY</text>
      <text x="720" y="0" text-anchor="end" class="mono" font-size="11" fill="#5c6b7a">TOTAL 12-WEEK COMMITS: <tspan fill="#22e6ff" font-weight="bold">367</tspan></text>

      <!-- Sparkline plot area -->
      <g transform="translate(0, 15)">
        <!-- Subtle horizontal grid lines -->
        <line x1="0" y1="0" x2="720" y2="0" stroke="#16222f" stroke-width="1" stroke-dasharray="3 3" />
        <line x1="0" y1="42" x2="720" y2="42" stroke="#16222f" stroke-width="1" stroke-dasharray="3 3" />
        <line x1="0" y1="85" x2="720" y2="85" stroke="#16222f" stroke-width="1" />

        <g>
    <defs>
      <linearGradient id="activitySparkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#00ff9c" stop-opacity="0.35" />
        <stop offset="100%" stop-color="#00ff9c" stop-opacity="0.0" />
      </linearGradient>
    </defs>
    <!-- Background Area Fill -->
    <path d=" M 0,61 L 65,53 L 131,58 L 196,44 L 262,37 L 327,48 L 393,27 L 458,39 L 524,32 L 589,17 L 655,8 L 720,13 L 720,85 L 0,85 Z" fill="url(#activitySparkGrad)" />
    <!-- Line Stroke -->
    <path d=" M 0,61 L 65,53 L 131,58 L 196,44 L 262,37 L 327,48 L 393,27 L 458,39 L 524,32 L 589,17 L 655,8 L 720,13" fill="none" stroke="#00ff9c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Data Points -->
    <circle cx="0" cy="61" r="2.5" fill="#00ff9c" opacity="0.85">
